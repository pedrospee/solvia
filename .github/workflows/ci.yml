name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so Gitleaks can scan every commit in the push or pull request.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run check

      # The backend's compiled output and the UI's Vite bundle: a broken build fails here.
      - run: npm run build

      # `drizzle-kit check` only validates the migration files among themselves, so drift is
      # detected by generating: a schema change without a committed migration produces new files.
      - name: Check that committed migrations match the schema
        timeout-minutes: 2
        env:
          MIGRATIONS: backend/src/infrastructure/database/migrations
        run: |
          npm run db:generate < /dev/null
          if [ -n "$(git status --porcelain -- "$MIGRATIONS")" ]; then
            git status --porcelain -- "$MIGRATIONS"
            echo "::error::The schema changed without a committed migration. Run npm run db:generate and commit the result."
            exit 1
          fi

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Comments on pull requests would need write permission; the failed job is enough.
          GITLEAKS_ENABLE_COMMENTS: false
